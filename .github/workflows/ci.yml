name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - v*
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Prepare fallback references
        shell: bash
        run: |
          mkdir -p Resonite
          curl -sSfL -o Resonite/ResoniteModLoader.dll https://github.com/resonite-modding-group/ResoniteModLoader/releases/latest/download/ResoniteModLoader.dll
          curl -sSfL -o Resonite/0Harmony.dll https://github.com/resonite-modding-group/ResoniteModLoader/releases/latest/download/0Harmony.dll

      - name: Restore
        run: dotnet restore ./ResoniteMozcInputMod.slnx

      - name: Verify formatting
        shell: bash
        run: |
          dotnet format ./ResoniteMozcInputMod.slnx whitespace --verify-no-changes --no-restore
          dotnet format ./ResoniteMozcInputMod.slnx style --verify-no-changes --no-restore --severity info
          dotnet format ./ResoniteMozcInputMod.slnx analyzers --verify-no-changes --no-restore --severity info

      - name: Build
        run: dotnet build ./ResoniteMozcInputMod.slnx -c Release --no-restore

      - name: Test
        run: dotnet test ./ResoniteMozcInputMod.slnx -c Release --no-build --logger "console;verbosity=normal"

      - name: Pack artifact
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          mkdir -p artifacts
          cp ./src/MozcInput/bin/Release/MozcInput.dll ./artifacts/
          cp ./tools/MozcInput.Bridge/bin/Release/MozcInput.Bridge.exe ./artifacts/ || true
          cp ./README.md ./LICENSE ./THIRD_PARTY_NOTICES.md ./artifacts/

      - name: Upload release artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: MozcInput
          path: artifacts
          if-no-files-found: error

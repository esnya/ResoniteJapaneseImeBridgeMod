name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - v*
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Prepare fallback references
        shell: bash
        run: |
          mkdir -p Resonite
          curl -sSfL -o Resonite/ResoniteModLoader.dll https://github.com/resonite-modding-group/ResoniteModLoader/releases/latest/download/ResoniteModLoader.dll
          curl -sSfL -o Resonite/0Harmony.dll https://github.com/resonite-modding-group/ResoniteModLoader/releases/latest/download/0Harmony.dll

      - name: Restore
        run: dotnet restore ./ResoniteJapaneseImeBridgeMod.slnx

      - name: Verify formatting
        shell: bash
        run: |
          dotnet format ./ResoniteJapaneseImeBridgeMod.slnx whitespace --verify-no-changes --no-restore
          dotnet format ./ResoniteJapaneseImeBridgeMod.slnx style --verify-no-changes --no-restore --severity info
          dotnet format ./ResoniteJapaneseImeBridgeMod.slnx analyzers --verify-no-changes --no-restore --severity info

      - name: Build
        run: dotnet build ./ResoniteJapaneseImeBridgeMod.slnx -c Release --no-restore

      - name: Test
        run: dotnet test ./ResoniteJapaneseImeBridgeMod.slnx -c Release --no-build --logger "console;verbosity=normal"

      - name: Pack artifact
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          mkdir -p artifacts/JapaneseImeBridge
          cp ./src/JapaneseImeBridge/bin/Release/JapaneseImeBridge.dll ./artifacts/JapaneseImeBridge/
          cp ./README.md ./LICENSE ./artifacts/JapaneseImeBridge/
          cd artifacts
          zip -r "JapaneseImeBridge-${GITHUB_REF_NAME}.zip" JapaneseImeBridge

      - name: Upload release artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: JapaneseImeBridge
          path: artifacts/JapaneseImeBridge-${{ github.ref_name }}.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "artifacts/JapaneseImeBridge-${GITHUB_REF_NAME}.zip" \
            --title "${GITHUB_REF_NAME}" \
            --notes "Japanese IME Bridge ${GITHUB_REF_NAME}"
